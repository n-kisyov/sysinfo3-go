<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>sysinfo3-go</title>
    <!-- Use a modern Google Font (Outfit) -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Sidebar Navigation (Optional, or just a header) -->
        <header class="app-header">
            <h1>Sysinfo<span>3</span></h1>
            <div id="last-updated">Updating...</div>
        </header>
        
        <main class="dashboard grid">
            
            <!-- Host Info -->
            <section class="card glass">
                <h2>System</h2>
                <div class="card-content" id="host-content">Loading...</div>
            </section>

            <!-- CPU Info -->
            <section class="card glass">
                <h2>CPU</h2>
                <div class="card-content" id="cpu-content">Loading...</div>
            </section>

            <!-- Memory Info -->
            <section class="card glass">
                <h2>Memory</h2>
                <div class="card-content" id="memory-content">Loading...</div>
            </section>

            <!-- Battery & Power -->
            <section class="card glass">
                <h2>Battery</h2>
                <div class="card-content" id="battery-content">Loading...</div>
            </section>

            <!-- GPU Info -->
            <section class="card glass">
                <h2>GPU</h2>
                <div class="card-content" id="gpu-content">Loading...</div>
            </section>

            <!-- Network -->
            <section class="card glass">
                <h2>Network</h2>
                <div class="card-content" id="network-content">Loading...</div>
            </section>

            <!-- Disks (Volumes) -->
            <section class="card glass" style="grid-column: 1 / -1;">
                <h2>Disks (Volumes)</h2>
                <div class="card-content" id="disks-content">Loading...</div>
            </section>

            <!-- Top Processes -->
            <section class="card glass" style="grid-column: 1 / -1;">
                <h2>Top Processes</h2>
                <div class="card-content" id="processes-content">Loading...</div>
            </section>

        </main>
    </div>
    <script type="module" src="./src/main.js"></script>
</body>
</html>
